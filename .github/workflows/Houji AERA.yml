name: Houji AERA Recovery

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL (AERA sync or manifest repo)'
        required: true
        default: 'https://github.com/AERA-Recovery/manifest.git'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: '16.0'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/QCerberusQ/OFRP-device_xiaomi_houji'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'aera-16.0'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/xiaomi/houji'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (if no common tree, leave blank)'
        required: false
        default: ''
      COMMON_PATH:
        description: 'COMMON_PATH (if no common tree, leave blank)'
        required: false
        default: ''
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'houji'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'twrp_houji'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'recovery'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:

    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Initialize workspace
      run: |
        mkdir -p workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
      id: pwd

    - name: Prepare the build environment
      run: |
        sudo apt update && sudo apt upgrade -y
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r) \
            git python3 python-is-python3 tar aria2 \
            cpio lz4 lzop liblz4-tool squashfs-tools libtinfo6 \
            openjdk-8-jdk zip unzip uuid-runtime
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
        sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
        sudo bash setup/install_android_sdk.sh
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Install OpenJDK
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup SSH Keys
      if: |
        startsWith(github.event.inputs.SYNC_URL, 'git@github.com') ||
        startsWith(github.event.inputs.DEVICE_TREE_URL, 'git@github.com') ||
        startsWith(github.event.inputs.COMMON_TREE_URL, 'git@github.com')
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: |
          ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Sync AERA sources and minimal manifest
      run: |
        AERA_DIR="${{ steps.pwd.outputs.workspace-folder }}/AERA_${{ github.event.inputs.MANIFEST_BRANCH }}"
        mkdir -p "$AERA_DIR"
        cd ${{ steps.pwd.outputs.workspace-folder }}
        git clone ${{ github.event.inputs.SYNC_URL }} sync_repo
        cd sync_repo
        if [ -f "./aera_sync.sh" ]; then
          chmod +x ./aera_sync.sh
          ./aera_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path "$AERA_DIR"
        elif [ -f "./orangefox_sync.sh" ]; then
          chmod +x ./orangefox_sync.sh
          ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path "$AERA_DIR"
        else
          cd "$AERA_DIR"
          repo init --depth=1 -u ${{ github.event.inputs.SYNC_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
        fi
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone device tree
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/AERA_${{ github.event.inputs.MANIFEST_BRANCH }}
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone common tree
      if: |
        github.event.inputs.COMMON_TREE_URL != '' &&
        github.event.inputs.COMMON_PATH != ''
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/AERA_${{ github.event.inputs.MANIFEST_BRANCH }}
        git clone ${{ github.event.inputs.COMMON_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.COMMON_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Patch vold Weaver AIDL wait (bounded 5s)
      run: |
        set -euo pipefail
        SRC="${{ steps.pwd.outputs.workspace-folder }}/AERA_${{ github.event.inputs.MANIFEST_BRANCH }}"
        F="$SRC/system/vold/Weaver1.cpp"
        if [ ! -f "$F" ]; then
          echo "NOTE: $F not found, skipping Weaver patch."
          exit 0
        fi
        cp "$F" "$F.orig"

        python3 - "$F" <<'PY'
        import io, sys
        p = sys.argv[1]
        s = io.open(p, encoding='utf-8').read()
        done = []

        old = '    AIBinder* binder = AServiceManager_waitForService(instance.c_str());'
        new = ('#pragma clang diagnostic push\n'
               '#pragma clang diagnostic ignored "-Wdeprecated-declarations"\n'
               '    // AERA: AServiceManager_getService polls for 5s then returns nullptr,\n'
               '    // instead of waiting forever like AServiceManager_waitForService.\n'
               '    AIBinder* binder = AServiceManager_getService(instance.c_str());\n'
               '#pragma clang diagnostic pop')
        if old in s:
            s = s.replace(old, new, 1); done.append('1-bounded-aidl-wait')
        else:
            print('NOTE: anchor 1 already patched or differs; skipping.')

        old2 = 'mDevice = ::android::hardware::weaver::V1_0::IWeaver::getService();'
        if old2 in s:
            s = s.replace(old2, 'mDevice = ::android::hardware::weaver::V1_0::IWeaver::tryGetService();', 1)
            done.append('2-hidl-nonblocking')

        old3 = '\tWeaverStatus status;\n\tWeaverConfig cfg;'
        if 'mDevice->getConfig' in s and old3 in s:
            s = s.replace(old3, '\tif (mDevice == nullptr)\n\t\treturn false;\n\n' + old3, 1)
            done.append('3-null-guard')

        if done:
            io.open(p, 'w', encoding='utf-8', newline='\n').write(s)
            print('applied: ' + ', '.join(done))
        PY

        diff -u "$F.orig" "$F" || true
        rm -f "$F.orig"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Building AERA Recovery
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/AERA_${{ github.event.inputs.MANIFEST_BRANCH }}

        export AERA_BUILD_DEVICE=${{ github.event.inputs.DEVICE_NAME }}
        export ALLOW_MISSING_DEPENDENCIES=true

        set +e
        source build/envsetup.sh
        set -e

        lunch ${{ github.event.inputs.MAKEFILE_NAME }}-bp2a-eng
        m -j$(nproc --all) ${{ github.event.inputs.BUILD_TARGET }}image
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Rename outputs with Date
      run: |
        BUILD_DATE=$(TZ=Asia/Istanbul date +%Y%m%d)
        OUT_DIR=${{ steps.pwd.outputs.workspace-folder }}/AERA_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}
        for f in "$OUT_DIR"/AERA*.img "$OUT_DIR"/AERA*.zip; do
          [ -e "$f" ] || continue
          base=$(basename "$f")
          ext="${base##*.}"
          name="${base%.*}"
          mv "$f" "$OUT_DIR/${name}-${BUILD_DATE}.${ext}"
        done

    - name: Check the output directory before uploading
      run: |
        ls -al ${{ steps.pwd.outputs.workspace-folder }}/AERA_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/
        echo
        ls -al ${{ steps.pwd.outputs.workspace-folder }}/AERA_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ steps.pwd.outputs.workspace-folder }}/AERA_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/AERA*.img
          ${{ steps.pwd.outputs.workspace-folder }}/AERA_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/AERA*.zip
          ${{ steps.pwd.outputs.workspace-folder }}/AERA_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/AERA*.md5
        name: AERA Recovery for ${{ github.event.inputs.DEVICE_NAME }} // ${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          **Unofficial AERA Recovery Build**
          
          - **Manifest:** ${{ github.event.inputs.MANIFEST_BRANCH }}
          - **Device:** ${{ github.event.inputs.DEVICE_NAME }}
          - **Target:** ${{ github.event.inputs.BUILD_TARGET }}image
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
