name: Rothko OrangeFox VendorBoot

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL'
        required: true
        default: 'https://gitlab.com/OrangeFox/sync.git'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: '14.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/QCerberusQ/OFRP-android_device_xiaomi_rothko'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'fox_14.1'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/xiaomi/rothko'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (if no common tree, leave blank)'
        required: false
        default: ''
      COMMON_PATH:
        description: 'COMMON_PATH (if no common tree, leave blank)'
        required: false
        default: ''
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'rothko'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'twrp_rothko'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'vendorboot'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:

    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Initialize workspace
      id: pwd
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT

    - name: Prepare the build environment
      run: |
        sudo apt update && sudo apt upgrade -y
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-$(uname -r) \
            git python3 python-is-python3 tar aria2 \
            cpio lz4 lzop liblz4-tool squashfs-tools libtinfo6 xxd
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
        sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
        sudo bash setup/install_android_sdk.sh
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Install OpenJDK
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Setup SSH Keys
      if: |
        startsWith(github.event.inputs.SYNC_URL, 'git@github.com') ||
        startsWith(github.event.inputs.DEVICE_TREE_URL, 'git@github.com') ||
        startsWith(github.event.inputs.COMMON_TREE_URL, 'git@github.com')
      uses: webfactory/ssh-agent@v0.9.0
      with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Sync OrangeFox sources and minimal manifest
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}
        git clone ${{ github.event.inputs.SYNC_URL }}
        cd sync
        git pull origin master
        ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone device tree
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone common tree
      if: |
        github.event.inputs.COMMON_TREE_URL != '' &&
        github.event.inputs.COMMON_PATH != ''
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        git clone ${{ github.event.inputs.COMMON_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.COMMON_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Patch vold Weaver AIDL wait (bounded 5s)
      run: |
        set -euo pipefail
        SRC="${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "== Weaver AIDL wait call sites in the synced workspace =="
        grep -rn --include=*.cpp --include=*.h \
             -e AServiceManager_waitForService \
             -e 'weaver::IWeaver::descriptor' \
             "$SRC/system/vold" "$SRC/bootable/recovery" || true

        F="$SRC/system/vold/Weaver1.cpp"
        test -f "$F" || { echo "FATAL: $F not found"; exit 1; }
        cp "$F" "$F.orig"

        python3 - "$F" <<'PY'
        import io, sys
        p = sys.argv[1]
        s = io.open(p, encoding='utf-8').read()
        done = []

        old = '    AIBinder* binder = AServiceManager_waitForService(instance.c_str());'
        new = ('#pragma clang diagnostic push\n'
               '#pragma clang diagnostic ignored "-Wdeprecated-declarations"\n'
               '    // OFRP: AServiceManager_getService polls for 5s then returns nullptr,\n'
               '    // instead of waiting forever like AServiceManager_waitForService.\n'
               '    AIBinder* binder = AServiceManager_getService(instance.c_str());\n'
               '#pragma clang diagnostic pop')
        if old in s:
            s = s.replace(old, new, 1); done.append('1-bounded-aidl-wait')
        else:
            print('FATAL: anchor 1 not found; see grep output above'); sys.exit(1)

        old2 = 'mDevice = ::android::hardware::weaver::V1_0::IWeaver::getService();'
        if old2 in s:
            s = s.replace(old2, 'mDevice = ::android::hardware::weaver::V1_0::IWeaver::tryGetService();', 1)
            done.append('2-hidl-nonblocking')
        else:
            print('NOTE: no HIDL fallback in this vold; nothing to bound.')

        old3 = '\tWeaverStatus status;\n\tWeaverConfig cfg;'
        if 'mDevice->getConfig' in s and old3 in s:
            s = s.replace(old3, '\tif (mDevice == nullptr)\n\t\treturn false;\n\n' + old3, 1)
            done.append('3-null-guard')
        else:
            print('NOTE: GetConfig anchor differs; skipped null guard.')

        io.open(p, 'w', encoding='utf-8', newline='\n').write(s)
        print('applied: ' + ', '.join(done))
        PY

        echo "== resulting diff =="
        diff -u "$F.orig" "$F" || true
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Patch SE and OMAPI AIDL Interfaces
      run: |
        set -euo pipefail
        SRC="${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"
        fail=0
        for entry in \
          "frameworks/base|omapi/aidl/Android.bp|android.se.omapi" \
          "hardware/interfaces|secure_element/aidl/Android.bp|android.hardware.secure_element"; do
          IFS='|' read -r repo relpath iface <<< "$entry"
          file="$SRC/$repo/$relpath"
          if [ ! -f "$file" ]; then
            echo "FATAL: $file not found - manifest layout changed?"; fail=1; continue
          fi
          line=$(grep -n "name: \"$iface\"," "$file" | head -1 | cut -d: -f1 || true)
          if [ -z "$line" ]; then
            echo "FATAL: interface $iface not found in $file"; fail=1; continue
          fi
          if sed -n "${line},$((line+8))p" "$file" | grep -q "recovery_available: true"; then
            echo "SKIP     $repo/$relpath (already patched)"
          else
            sed -i "${line}a\\    recovery_available: true," "$file"
            echo "PATCHED  $repo/$relpath"
          fi
          grep -A4 "name: \"$iface\"," "$file" | head -5
        done
        [ "$fail" -eq 0 ] || exit 1
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Building recovery
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}

        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        set -e
        if [[ "${{ github.event.inputs.MANIFEST_BRANCH }}" == "14.1" ]]; then
          lunch ${{ github.event.inputs.MAKEFILE_NAME }}-ap2a-eng && make clean && mka adbd ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)
        else
          lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng && make clean && mka adbd ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)
        fi

        echo "== FBE Artifact Check =="
        OUT="${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out"
        for f in \
          "$OUT/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root/system/bin/se_omapi" \
          "$OUT/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root/system/lib64/android.se.omapi-V1-ndk.so" \
          "$OUT/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery/root/system/lib64/android.hardware.secure_element-V1-ndk.so"; do
          [ -f "$f" ] || { echo "FATAL: $f missing from recovery ramdisk"; exit 1; }
        done
        echo "Tum FBE dosyalari basariyla ramdisk'e eklendi!"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Repack Vendor Boot for Rothko
      run: |
        set -euo pipefail
        FOX="${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"
        OUT="$FOX/out"; HOST="$OUT/host/linux-x86/bin"
        POUT="$OUT/target/product/${{ github.event.inputs.DEVICE_NAME }}"
        MAGISKBOOT="$FOX/vendor/recovery/tools/magiskboot"
        DEV="$FOX/device/xiaomi/${{ github.event.inputs.DEVICE_NAME }}"
        REC_SRC="$POUT/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.cpio.lz4"
        STOCK="$DEV/prebuilt/stock_vendor_boot.img"
        WORK=$(mktemp -d); cd "$WORK"; trap 'cd /; rm -rf "$WORK"' EXIT

        test -f "$REC_SRC" || { echo "FATAL: fragment $REC_SRC missing"; exit 1; }

        echo "== 1. unpack stock (NO -n: full decompression) =="
        cp "$STOCK" stock.img
        "$MAGISKBOOT" unpack stock.img
        ls -la dtb vendor_ramdisk* 2>/dev/null || true
        test -f dtb || { echo "FATAL: dtb not found after unpack"; ls -la; exit 1; }

        PLAT_CPIO="ramdisk.cpio"
        [ ! -f "$PLAT_CPIO" ] && PLAT_CPIO="vendor_ramdisk/ramdisk.cpio"
        test -f "$PLAT_CPIO" || { echo "FATAL: platform ramdisk ($PLAT_CPIO) not found"; exit 1; }

        echo "== 2. recovery fragment: decompress + extract =="
        "$HOST/lz4" -d -f "$REC_SRC" fox.cpio
        rm -rf rec && mkdir rec
        ( cd rec && cpio -idm --quiet --no-absolute-filenames < ../fox.cpio )

        echo "== 3. trim =="
        rm -f  rec/twres/fonts/DroidSansFallback.ttf
        rm -rf rec/system/etc/terminfo
        rm -f  rec/sbin/bash rec/sbin/magiskboot

        # keep only en.xml; TW_EXTRA_LANGUAGES=false should already have done this,
        # so report what is actually removed to confirm the build flag works
        if [ -d rec/twres/languages ]; then
          find rec/twres/languages -type f ! -name 'en.xml' -print -delete || true
        fi

        echo "== 4. SPL match (guarded) =="
        rm -rf plat && mkdir plat
        ( cd plat && cpio -idm --quiet --no-absolute-filenames \
            prop.default default.prop < "../$PLAT_CPIO" ) || true
        SPL=$(grep -hm1 '^ro.build.version.security_patch=' \
                plat/prop.default plat/default.prop 2>/dev/null | cut -d= -f2 || true)
        echo "Stock SPL: $SPL"
        [ -n "$SPL" ] || { echo "FATAL: cannot read stock SPL from platform ramdisk"; ls -la plat; exit 1; }
        for f in rec/prop.default rec/default.prop; do
          [ -f "$f" ] || continue
          sed -i "s/^ro.build.version.security_patch=.*/ro.build.version.security_patch=$SPL/" "$f"
          sed -i "s/^ro.vendor.build.security_patch=.*/ro.vendor.build.security_patch=$SPL/" "$f"
        done
        grep -H security_patch rec/prop.default rec/default.prop || true

        echo "== 5. recompress: LZ4 preferred, gzip fallback =="
        "$HOST/mkbootfs" -d "$POUT/system" rec > rec.cpio
        cp "$PLAT_CPIO" plat.cpio
        "$HOST/lz4" -l -12 -f plat.cpio plat.cpio.lz4
        "$HOST/lz4" -l -12 -f rec.cpio  rec.cpio.lz4
        FRAG="rec.cpio.lz4"

        # avbtool usable size (64MiB - footer/vbmeta) minus platform, minus stock dtb,
        # minus header page + table page + up to 3 alignment pages = 24 KiB slack
        MAX_FRAG=$(( 67039232 - $(stat -c%s plat.cpio.lz4) - $(stat -c%s dtb) - 24576 ))
        if [ "$(stat -c%s "$FRAG")" -gt "$MAX_FRAG" ]; then
          echo "lz4 fragment over budget - falling back to gzip -9"
          gzip -9 -n -c rec.cpio > rec.cpio.gz
          FRAG="rec.cpio.gz"
        fi
        echo "fragment: $FRAG ($(stat -c%s "$FRAG") bytes, budget $MAX_FRAG)"
        [ "$(stat -c%s "$FRAG")" -le "$MAX_FRAG" ] || {
          echo "FATAL: even gzip -9 exceeds the budget by $(( $(stat -c%s "$FRAG") - MAX_FRAG )) bytes"; exit 1; }

        echo "== 6. assemble + AVB footer =="
        "$HOST/mkbootimg" \
          --dtb dtb \
          --base 0x3fff8000 --pagesize 4096 --header_version 4 \
          --os_version 14 --os_patch_level "$SPL" \
          --vendor_cmdline "bootopt=64S3,32N2,64N2 androidboot.selinux=permissive" \
          --kernel_offset 0x00008000 --ramdisk_offset 0x26f08000 \
          --tags_offset 0x07c88000 --dtb_offset 0x07c88000 \
          --vendor_ramdisk plat.cpio.lz4 \
          --ramdisk_type RECOVERY --ramdisk_name recovery \
          --vendor_ramdisk_fragment "$FRAG" \
          --vendor_boot vendor_boot_rothko.img

        "$HOST/avbtool" add_hash_footer --image vendor_boot_rothko.img \
          --partition_size 67108864 --partition_name vendor_boot

        echo "== 6.5. sanity check: ramdisk table + per-fragment magic =="
        "$HOST/unpack_bootimg" --boot_img vendor_boot_rothko.img --out hdr
        # the v4 ramdisk table has no compression field, so read the magic bytes:
        # 0221 = lz4, 1f8b = gzip
        for f in hdr/vendor_ramdisk*; do
          [ -f "$f" ] || continue
          printf '%-40s magic=%s\n' "$f" "$(head -c2 "$f" | xxd -p)"
        done

        echo "== 7. ship only the repacked image =="
        find "$POUT" -maxdepth 1 -name '*.img' -delete
        cp vendor_boot_rothko.img "$POUT/OrangeFox-Rothko-Repacked.img"
        ls -lh "$POUT/"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Rename outputs with Date
      run: |
        BUILD_DATE=$(TZ=Asia/Istanbul date +%Y%m%d)
        OUT_DIR=${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}
        for f in "$OUT_DIR"/OrangeFox*.img "$OUT_DIR"/OrangeFox*.zip; do
          [ -e "$f" ] || continue
          base=$(basename "$f")
          ext="${base##*.}"
          name="${base%.*}"
          mv "$f" "$OUT_DIR/${name}-${BUILD_DATE}.${ext}"
        done

    - name: Check the output directory before uploading
      run: |
        ls -al ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/
        echo
        ls -al ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.img
          ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
        name: OrangeFox Recovery for ${{ github.event.inputs.DEVICE_NAME }} // ${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          **Unofficial OrangeFox Recovery Build**

          - **Manifest:** ${{ github.event.inputs.MANIFEST_BRANCH }}
          - **Device:** ${{ github.event.inputs.DEVICE_NAME }}
          - **Target:** ${{ github.event.inputs.BUILD_TARGET }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
